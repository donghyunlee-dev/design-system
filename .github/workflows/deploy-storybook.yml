name: Deploy Storybook to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Prepare source outside the git checkout
        # Vercel CLI attaches git commit metadata whenever the deploy runs inside a
        # .git working directory, and private-org-repo + Hobby plan then blocks the
        # deployment as "commit author lacks contributing access". Archive the full
        # source (including api/mcp.ts and vercel.json) without .git so Vercel can run
        # the configured Storybook + MCP build while avoiding that check.
        run: |
          mkdir -p "$RUNNER_TEMP/storybook-deploy"
          git archive --format=tar HEAD -o "$RUNNER_TEMP/storybook-deploy.tar"
          tar -xf "$RUNNER_TEMP/storybook-deploy.tar" -C "$RUNNER_TEMP/storybook-deploy"

      - name: Deploy to Vercel
        working-directory: ${{ runner.temp }}/storybook-deploy
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
